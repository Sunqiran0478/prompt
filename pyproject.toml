[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "promptos"
version = "0.1.0"
description = "Provider-agnostic automated prompt optimization for general tasks"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "PromptOS contributors"}]
keywords = ["prompt-engineering", "llm", "evaluation", "optimization", "llmops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
dev = ["build>=1.2", "coverage>=7.5", "ruff>=0.6"]

[project.scripts]
promptos = "promptos.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F"]

[tool.coverage.run]
branch = true
source = ["promptos"]

[tool.coverage.report]
fail_under = 50
show_missing = true
