name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and quality tools
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Unit and CLI integration tests with coverage
        run: coverage run -m unittest discover -s tests -v && coverage report
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify installed CLI
        run: python -m pip install --force-reinstall dist/*.whl && promptos --help
